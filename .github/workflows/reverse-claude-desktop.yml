name: reverse-claude-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest claude-desktop .deb
        id: deb
        run: |
          REL=$(curl -fsSL "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages" | grep '^Filename: pool/main/c/claude-desktop/claude-desktop_' | sort -V | tail -n 1 | cut -d' ' -f2)
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
      - name: Download claude-desktop .deb
        run: curl -fLO "https://downloads.claude.ai/claude-desktop/apt/stable/${{ steps.deb.outputs.rel }}"
      - name: Extract .deb
        run: mkdir -p extract && dpkg-deb -x claude-desktop_*.deb extract/
      - name: Locate asar
        id: asar
        run: |
          find extract -name '*.asar' | tee asar-list.txt
          A=$(find extract -name 'app.asar' | head -n1)
          echo "path=$A" >> "$GITHUB_OUTPUT"
      - name: Unpack app.asar
        run: mkdir -p unpacked && npx --yes asar extract "${{ steps.asar.outputs.path }}" unpacked
      - name: Analyze
        run: |
          mkdir -p report
          B=unpacked/.vite/build
          R=unpacked/.vite/renderer
          {
            echo "# 问候语字体分析"
            echo
            echo "## greeting 上下文"
            grep -rhoE --include='*.js' '.{50}greeting.{100}' "$R" 2>/dev/null | sort -u | head -10
            echo
            echo "## title/display 字体变量"
            grep -rhoE --include='*.js' '.{40}(cds-font-sans-display|_cds-title-family|cds-title-family).{60}' "$R" 2>/dev/null | sort -u | head -8
            echo
            echo "## css 中 title/display 字体"
            grep -rhoE --include='*.css' 'font-family:[^;}]{1,90}' unpacked 2>/dev/null | grep -iE 'title|display|serif' | sort -u | head -10
            echo
            echo "## 问候语相关 className"
            grep -rhoE --include='*.js' '[a-zA-Z-]*(greeting|welcome|hero)[a-zA-Z-]*' "$R" 2>/dev/null | sort -u | head -15
            echo
            echo "## css 中 greeting/welcome/hero 类"
            grep -rhoE --include='*.css' '\.[a-zA-Z-]*(greeting|welcome|hero)[a-zA-Z-]*[^{]{0,80}\{[^}]{0,150}' unpacked 2>/dev/null | head -10
          } > report/REVERSE-CLAUDE-DESKTOP.md
      - name: Collect fonts
        run: |
          mkdir -p fonts
          cp unpacked/.vite/renderer/main_window/assets/*.woff2 fonts/
      - name: Upload fonts artifact
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-fonts
          path: fonts/
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "docs: greeting font analysis" || echo "nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/happy-everyday-everyweek/cc-harness-android.git main || echo "push failed"
