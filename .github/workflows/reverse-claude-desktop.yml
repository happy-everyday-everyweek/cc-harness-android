name: reverse-claude-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest claude-desktop .deb
        id: deb
        run: |
          REL=$(curl -fsSL "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages" | grep '^Filename: pool/main/c/claude-desktop/claude-desktop_' | sort -V | tail -n 1 | cut -d' ' -f2)
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
      - name: Download claude-desktop .deb
        run: curl -fLO "https://downloads.claude.ai/claude-desktop/apt/stable/${{ steps.deb.outputs.rel }}"
      - name: Extract .deb
        run: mkdir -p extract && dpkg-deb -x claude-desktop_*.deb extract/
      - name: Locate asar
        id: asar
        run: |
          find extract -name '*.asar' | tee asar-list.txt
          A=$(find extract -name 'app.asar' | head -n1)
          echo "path=$A" >> "$GITHUB_OUTPUT"
      - name: Unpack app.asar
        run: mkdir -p unpacked && npx --yes asar extract "${{ steps.asar.outputs.path }}" unpacked
      - name: Analyze
        run: |
          mkdir -p report
          B=unpacked/.vite/build
          R=unpacked/.vite/renderer
          {
            echo "# Claude Desktop 逆向分析"
            echo
            echo "## 字体声明（fontFamily 驼峰，JS）"
            grep -rhoE --include='*.js' 'fontFamily:[^,;}]{1,90}' "$R" 2>/dev/null | sort -u | head -15
            echo
            echo "## 字体声明（css 文件）"
            find unpacked -name '*.css' -exec grep -hoE 'font-family:[^;}]{1,90}' {} + 2>/dev/null | sort -u | head -15
            echo
            echo "## Inter 上下文"
            grep -rhoE --include='*.js' '.{40}Inter.{50}' "$R" 2>/dev/null | head -5
            echo
            echo "## 问候语（Good 单独搜，全部）"
            grep -rhoE --include='*.js' '.{30}Good [a-z]+.{40}' unpacked 2>/dev/null | sort -u | head -10
            echo
            echo "## 问候语（good 小写，全部）"
            grep -rhoE --include='*.js' '.{30}good [a-z]+.{40}' unpacked 2>/dev/null | sort -u | head -10
            echo
            echo "## 字体名命中（全部进程）"
            for f in Claude Sans Inter Styrene Söhne Tiempos system-ui; do
              N=$(grep -rho --include='*.js' -e "$f" unpacked 2>/dev/null | wc -l)
              printf '%s: %s\n' "$f" "$N"
            done
            echo
            echo "## 文件总数与总大小"
            find unpacked -type f | wc -l
            du -sh unpacked
          } > report/REVERSE-CLAUDE-DESKTOP.md
      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-unpacked
          path: |
            unpacked
            report
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "docs: Claude Desktop 逆向分析报告" || echo "nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/happy-everyday-everyweek/cc-harness-android.git main || echo "push failed"
