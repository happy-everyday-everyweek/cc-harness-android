name: reverse-claude-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest claude-desktop .deb
        id: deb
        run: |
          REL=$(curl -fsSL "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages" | grep '^Filename: pool/main/c/claude-desktop/claude-desktop_' | sort -V | tail -n 1 | cut -d' ' -f2)
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
      - name: Download claude-desktop .deb
        run: curl -fLO "https://downloads.claude.ai/claude-desktop/apt/stable/${{ steps.deb.outputs.rel }}"
      - name: Extract .deb
        run: mkdir -p extract && dpkg-deb -x claude-desktop_*.deb extract/
      - name: Locate asar
        id: asar
        run: |
          find extract -name '*.asar' | tee asar-list.txt
          A=$(find extract -name 'app.asar' | head -n1)
          echo "path=$A" >> "$GITHUB_OUTPUT"
      - name: Unpack app.asar
        run: mkdir -p unpacked && npx --yes asar extract "${{ steps.asar.outputs.path }}" unpacked
      - name: Analyze
        run: |
          mkdir -p report
          B=unpacked/.vite/build
          {
            echo "# 问候语组件字体定位"
            echo
            echo "## greeting + fontFamily 同现"
            grep -rhoE --include='*.js' '.{80}greeting.{200}' "$B" 2>/dev/null | grep -iE 'font|title|display|serif|sans|className' | head -8
            echo
            echo "## 问候语生成（小时判断）"
            grep -rhoE --include='*.js' '.{40}(getHours|getHour)\(\).{100}' "$B" 2>/dev/null | sort -u | head -8
            echo
            echo "## 时间段问候文本"
            grep -rhoE --include='*.js' '.{20}(evening|afternoon).{60}' "$B" 2>/dev/null | grep -iE 'good|greet|morning' | sort -u | head -8
            echo
            echo "## title 类字体声明（css 完整）"
            grep -rhoE --include='*.css' '[^{}]*title[^{}]*\{[^}]{0,200}\}' unpacked 2>/dev/null | grep -iE 'font-family' | head -8
            echo
            echo "## 大号字体（font-size 配合 serif/sans）"
            grep -rhoE --include='*.css' 'font-family:[^;}]{1,60}[^}]*font-size:[^;}]{1,30}' unpacked 2>/dev/null | sort -u | head -10
          } > report/REVERSE-CLAUDE-DESKTOP.md
      - name: Collect fonts
        run: |
          mkdir -p fonts
          cp unpacked/.vite/renderer/main_window/assets/*.woff2 fonts/
      - name: Upload fonts artifact
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-fonts
          path: fonts/
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "docs: greeting component font" || echo "nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/happy-everyday-everyweek/cc-harness-android.git main || echo "push failed"
