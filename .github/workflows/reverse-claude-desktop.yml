name: reverse-claude-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest claude-desktop .deb
        id: deb
        run: |
          REL=$(curl -fsSL "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages" | grep '^Filename: pool/main/c/claude-desktop/claude-desktop_' | sort -V | tail -n 1 | cut -d' ' -f2)
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
      - name: Download claude-desktop .deb
        run: curl -fLO "https://downloads.claude.ai/claude-desktop/apt/stable/${{ steps.deb.outputs.rel }}"
      - name: Extract .deb
        run: mkdir -p extract && dpkg-deb -x claude-desktop_*.deb extract/
      - name: Locate asar
        id: asar
        run: |
          find extract -name '*.asar' | tee asar-list.txt
          A=$(find extract -name 'app.asar' | head -n1)
          echo "path=$A" >> "$GITHUB_OUTPUT"
      - name: Unpack app.asar
        run: mkdir -p unpacked && npx --yes asar extract "${{ steps.asar.outputs.path }}" unpacked
      - name: Analyze
        run: |
          mkdir -p report
          {
            echo "# 问候语字体确认"
            echo
            echo "## CSS 变量定义（title/display/serif/sans）"
            grep -rhoE --include='*.css' -- '--(_cds-title-family|cds-font-sans-display|cds-font-serif|font-anthropic-serif|font-anthropic-sans|cds-font-sans)[^;{]*[;}]' unpacked 2>/dev/null | sort -u | head -15
            echo
            echo "## greeting 在 build chunk"
            grep -rhoE --include='*.js' '.{40}[gG]reeting.{80}' unpacked/.vite/build 2>/dev/null | sort -u | head -8
            echo
            echo "## 问候语可能组件（timeOfDay/daypart）"
            grep -rhoE --include='*.js' '.{30}(timeOfDay|daypart|day-part).{60}' unpacked/.vite 2>/dev/null | sort -u | head -8
            echo
            echo "## serif 使用位置统计"
            for v in anthropic-serif anthropic-sans cds-font-sans-display cds-title; do
              N=$(grep -rho --include='*.css' -e "$v" unpacked 2>/dev/null | wc -l)
              printf '%s: %s\n' "$v" "$N"
            done
          } > report/REVERSE-CLAUDE-DESKTOP.md
      - name: Collect fonts
        run: |
          mkdir -p fonts
          cp unpacked/.vite/renderer/main_window/assets/*.woff2 fonts/
      - name: Upload fonts artifact
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-fonts
          path: fonts/
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "docs: greeting font confirm" || echo "nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/happy-everyday-everyweek/cc-harness-android.git main || echo "push failed"
