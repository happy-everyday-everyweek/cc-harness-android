name: reverse-claude-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve latest claude-desktop .deb
        id: deb
        run: |
          REL=$(curl -fsSL "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages" | grep '^Filename: pool/main/c/claude-desktop/claude-desktop_' | sort -V | tail -n 1 | cut -d' ' -f2)
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
      - name: Download claude-desktop .deb
        run: curl -fLO "https://downloads.claude.ai/claude-desktop/apt/stable/${{ steps.deb.outputs.rel }}"
      - name: Extract .deb
        run: mkdir -p extract && dpkg-deb -x claude-desktop_*.deb extract/
      - name: Locate asar
        id: asar
        run: |
          find extract -name '*.asar' | tee asar-list.txt
          A=$(find extract -name 'app.asar' | head -n1)
          echo "path=$A" >> "$GITHUB_OUTPUT"
      - name: Unpack app.asar
        run: mkdir -p unpacked && npx --yes asar extract "${{ steps.asar.outputs.path }}" unpacked
      - name: Analyze
        run: |
          mkdir -p report
          {
            echo "# 字体文件与 @font-face 分析"
            echo
            echo "## 字体文件（woff/woff2/ttf/otf）"
            find unpacked \( -name '*.woff' -o -name '*.woff2' -o -name '*.ttf' -o -name '*.otf' \) | head -30
            echo
            echo "## @font-face 声明（css）"
            grep -rhoE --include='*.css' '@font-face[^{]*\{[^}]{0,200}' unpacked 2>/dev/null | head -10
            echo
            echo "## @font-face 声明（js 内联）"
            grep -rhoE --include='*.js' '@font-face[^{]*\{[^}]{0,200}' unpacked 2>/dev/null | head -10
            echo
            echo "## 字体 URL（css url 引用）"
            grep -rhoE --include='*.css' 'url\([^)]{1,150}\)' unpacked 2>/dev/null | grep -iE 'font|woff|ttf|otf|anthropic' | sort -u | head -15
            echo
            echo "## 字体名引用（js）"
            for f in anthropic-sans anthropic-serif Anthropicons cds-font; do
              N=$(grep -rho --include='*.js' -e "$f" unpacked 2>/dev/null | wc -l)
              printf '%s: %s\n' "$f" "$N"
            done
            echo
            echo "## deb 内字体（extract 层）"
            find extract \( -name '*.woff' -o -name '*.woff2' -o -name '*.ttf' -o -name '*.otf' \) | head -20
          } > report/REVERSE-CLAUDE-DESKTOP.md
      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-unpacked
          path: |
            unpacked
            report
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/
          git commit -m "docs: font file analysis" || echo "nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/happy-everyday-everyweek/cc-harness-android.git main || echo "push failed"
